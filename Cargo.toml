[package]
name = "dotenvor"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/JohnTitor/dotenvor"
documentation = "https://docs.rs/dotenvor"
categories = ["config", "parser-implementations"]
keywords = ["dotenv", "env", "configuration", "parser", "loader"]
readme = "README.md"
description = "Small, fast `.env` parser and loader for Rust"

[workspace]
members = ["dotenvor-macros"]

[workspace.dependencies]
dotenvor-macros = { version = "0.1.0", path = "dotenvor-macros" }

[dependencies]
dotenvor-macros = { workspace = true }

[dev-dependencies]
criterion = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }
trybuild = "1.0"

[[bin]]
name = "dotenv"
path = "src/bin/dotenv.rs"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "load"
harness = false
